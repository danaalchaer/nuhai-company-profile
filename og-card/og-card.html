<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0A0A0C}
  .card{
    position:relative;width:1200px;height:630px;overflow:hidden;
    background:#0A0A0C;color:#FAFAF8;font-family:'DM Sans',system-ui,sans-serif;
  }
  .ring{position:absolute;right:-330px;top:-110px;width:980px;height:980px;pointer-events:none}
  .ring ellipse{fill:none;stroke:#4FC9C9}
  .logo{position:absolute;left:72px;top:64px;height:56px;width:auto}
  .headline{
    position:absolute;left:72px;bottom:120px;margin:0;
    font-size:94px;line-height:0.98;font-weight:700;letter-spacing:-0.035em;
    max-width:900px;
  }
  .headline em{font-style:normal;color:#4FC9C9}
  .sub{
    position:absolute;left:72px;bottom:64px;margin:0;
    font-size:24px;font-weight:300;color:#888884;letter-spacing:0.005em;
  }
  .sub b{font-weight:400;color:#FAFAF8}
</style>
</head>
<body>
<div class="card">
  <svg class="ring" viewBox="0 0 980 980" aria-hidden="true">
    <g transform="rotate(-28 490 490)">
      <ellipse cx="490" cy="490" rx="430" ry="150" stroke-width="1" opacity="0.18"/>
      <ellipse cx="490" cy="490" rx="430" ry="150" stroke-width="10" opacity="0.06"/>
    </g>
    <g transform="rotate(62 490 490)">
      <ellipse cx="490" cy="490" rx="400" ry="70" stroke-width="2" opacity="0.55"/>
      <ellipse cx="490" cy="490" rx="400" ry="70" stroke-width="22" opacity="0.10"/>
    </g>
  </svg>
  <img class="logo" src="nuhai-logo.png" alt="nuhai">
  <h1 class="headline">HEADLINE</h1>
  <p class="sub"><b>Company profile 2026</b> &nbsp;Business growth intelligence, built in Dubai.</p>
</div>
</body>
</html>
